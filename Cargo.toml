[package]
name = "rdb2g"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "cargo"] }
env_logger = "0.11.11"
log = { version = "0.4.34", features = ["release_max_level_info"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread"] }
